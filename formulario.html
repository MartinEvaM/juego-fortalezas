<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedica tus Fortalezas ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="max-w-lg w-full bg-white rounded-[32px] p-6 sm:p-8 shadow-xl border border-purple-100 my-4">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-indigo-900 flex items-center justify-center gap-1.5">
                ✨ El Saco de Fortalezas ✨
            </h2>
            <p id="subtitulo-voto" class="text-xs text-indigo-500 font-semibold mt-1 bg-indigo-50 px-3 py-1 rounded-full inline-block">Completa el espejo para tu compañera</p>
        </div>

        <form id="form-respuesta" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Para la compañera: 🌸</label>
                <input type="text" id="nombre-chica" placeholder="Escribe el nombre de la chica (ej: ENRIC)" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 font-extrabold text-indigo-950 outline-none uppercase" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">1. Su mayor Fortaleza 💪</label>
                <textarea id="fortaleza" rows="2" placeholder="¿Cuál es su mayor cualidad o recurso interior?" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">2. Color que la representa 🎨</label>
                <input type="text" id="color" placeholder="¿Qué color te inspira al pensar en ella y por qué?" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">3. Personaje de ficción 🎬</label>
                <input type="text" id="personaje" placeholder="Película, serie o libro que la represente y por qué" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">4. Un Plan que le propondrías 🗺️</label>
                <input type="text" id="plan" placeholder="Un plan bonito para hacer juntas en el futuro" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">5. Canción que le dedicarías y por qué 📻</label>
                <input type="text" id="cancion" placeholder="Esa canción que te recuerda a su energía" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">6. Superpoder que aporta al grupo ☀️</label>
                <input type="text" id="superpoder" placeholder="¿Qué energía positiva o magia aporta cuando entra?" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">7. Frase de fuerza para días grises 🌱</label>
                <input type="text" id="frase" placeholder="Un mensaje cariñoso para que lo lea si se siente bajita" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">8. Animal que representa su espíritu 🧸</label>
                <input type="text" id="animal" placeholder="¿Qué animal simboliza su fuerza, dulzura o lealtad?" class="w-full p-3 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div class="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100 border-dashed">
                <label class="block text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1.5">📸 ¿Quieres dedicarle una foto?</label>
                <input type="file" id="foto-input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-750 cursor-pointer">
            </div>

            <button type="submit" class="w-full py-3.5 mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:scale-[1.01] text-sm">
                🚀 Enviar dedicatoria al Collage
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQlgd3w5Psj2dwkDUtPoGHVqwzE8MLNjA",
            authDomain: "juego-fortalezas.firebaseapp.com",
            projectId: "juego-fortalezas",
            storageBucket: "juego-fortalezas.firebasestorage.app",
            messagingSenderId: "754972102827",
            appId: "1:754972102827:web:714f432914a1b8b340a7ee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            const parametros = new URLSearchParams(window.location.search);
            const chicaParam = parametros.get('chica');
            const inputNombre = document.getElementById('nombre-chica');

            if (chicaParam) {
                inputNombre.value = decodeURIComponent(chicaParam).toUpperCase();
                inputNombre.readOnly = true;
                document.getElementById('subtitulo-voto').innerText = `Enviando dedicatoria a ${chicaParam.toUpperCase()}`;
            } else {
                inputNombre.classList.remove('bg-gray-50');
                inputNombre.readOnly = false;
            }
        });

        document.getElementById('form-respuesta').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombreChica = document.getElementById('nombre-chica').value.trim().toUpperCase();
            const fortaleza = document.getElementById('fortaleza').value;
            const color = document.getElementById('color').value;
            const personaje = document.getElementById('personaje').value;
            const plan = document.getElementById('plan').value;
            const cancion = document.getElementById('cancion').value;
            const superpoder = document.getElementById('superpoder').value;
            const frase = document.getElementById('frase').value;
            const animal = document.getElementById('animal').value;
            const archivoFoto = document.getElementById('foto-input').files[0];

            let fotoBase64 = "";

            if (archivoFoto) {
                fotoBase64 = await convertirImagenABase64(archivoFoto);
            }

            try {
                await addDoc(collection(db, "respuestas"), {
                    chicaNombre: nombreChica,
                    fortaleza: fortaleza,
                    color: color,
                    personaje: personaje,
                    plan: plan,
                    cancion: cancion,
                    superpoder: superpoder,
                    frase: frase,
                    animal: animal,
                    foto: fotoBase64,
                    fecha: new Date().toISOString()
                });

                alert("¡Dedicatoria enviada con éxito! Muchísimas gracias ✨");
                document.getElementById('form-respuesta').reset();
                
                // Si venía de QR, mantenemos el campo bloqueado tras resetear
                const parametros = new URLSearchParams(window.location.search);
                const chicaParam = parametros.get('chica');
                if (chicaParam) {
                    document.getElementById('nombre-chica').value = decodeURIComponent(chicaParam).toUpperCase();
                }

            } catch (error) {
                console.error("Error guardando en Firestore: ", error);
                alert("Uf, algo ha fallado al enviar. Inténtalo de nuevo.");
            }
        });

        function convertirImagenABase64(archivo) {
            return new Promise((resolve, reject) => {
                const lector = new FileReader();
                lector.readAsDataURL(archivo);
                lector.onload = () => resolve(lector.result);
                lector.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
